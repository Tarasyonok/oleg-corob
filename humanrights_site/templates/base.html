<!DOCTYPE html>

<head>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Abel&family=Abril+Fatface&family=Anton&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kelly+Slab&family=Luxurious+Roman&display=swap"
    rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Custom CSS (add later) -->
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="icon" type="image/png" href="{% static 'img/logo.png' %}">
</head>

<body>
  <!-- Header -->
  {% include 'includes/header.html' %}
  {% include 'includes/latest-articles.html' %}

  <main class="container">
    <!-- Content Block -->
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  {% include 'includes/footer.html' %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
    function reloadOnceEveryTenMinutes() {
    const lastReloadKey = 'lastPageReload';
    const tenMinutes = 5 * 60 * 1000; // 10 minutes in milliseconds
    const now = Date.now();

    // Get the last reload timestamp
    const lastReload = localStorage.getItem(lastReloadKey);

    if (!lastReload || (now - parseInt(lastReload)) > tenMinutes) {
        // Update timestamp first
        localStorage.setItem(lastReloadKey, now.toString());

        // Force reload with cache busting
        setTimeout(() => {
            window.location.reload(true);
            // Or alternative: window.location.href = window.location.href + '?_=' + now;
        }, 100); // Small delay to ensure timestamp is saved
    }
}

// Call on page load
window.addEventListener('load', reloadOnceEveryTenMinutes);
  </script>
</body>

</html>
